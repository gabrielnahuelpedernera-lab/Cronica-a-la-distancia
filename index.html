<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuestro Viaje - Para mi vida hermosa</title>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: 'Georgia', serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .ticket { background: #fff; color: #333; padding: 20px; border-radius: 10px; width: 350px; border: 2px dashed #ff4757; text-align: center; margin-bottom: 20px; }
        .hero-img { width: 300px; border-radius: 10px; margin-bottom: 20px; border: 4px solid #fff; }
        .phrase { font-style: italic; font-size: 1.2rem; color: #ff4757; margin: 20px 0; }
        .audio-player { background: #333; padding: 15px; border-radius: 50px; }
    </style>
</head>
<body>

    <!-- Tu Foto Principal -->
    <img src="selfie-auto.jpg" class="hero-img" alt="Nosotros">

    <!-- El Ticket Personalizado -->
    <div class="ticket">
        <h2 style="color: #ff4757;">TICKET DE AMOR</h2>
        <p><strong>Destino:</strong> Donde estemos juntos</p>
        <p><strong>Distancia recorrida:</strong> 700km y más</p>
        <hr>
        <p class="phrase">"Lo que llevamos amándonos mientras sostenemos esto cuando tenemos que hacer otras cosas."</p>
    </div>

    <!-- Tu Audio -->
    <div class="audio-player">
        <audio controls>
            <source src="poema-gabriel.mp3" type="audio/mpeg">
            Tu navegador no soporta audio.
        </audio>
    </div>

    <script>
        console.log("Experiencia cargada con éxito para ustedes dos.");
    </script>
</body>
</html>
